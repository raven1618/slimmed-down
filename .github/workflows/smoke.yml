# On each push: the phone check of CLAUDE.md's quality bar (exposure, antialiasing, drag direction), then every view
# of the site in a browser (fails on a view that does not open or a script error). Screenshots are attached to the run.
name: Check every view
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # the 3D is drawn in software on GitHub: the run takes about 22 minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run phone
      - run: npm test
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/shots/
