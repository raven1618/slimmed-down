ew York, NY 10004 · EE. UU.</text><text x="556" y="75" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.2" font-weight="400" text-anchor="end">T +1 212 555 0100</text><text x="556" y="85.5" fill="#0B1D3A" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.2" font-weight="600" text-anchor="end">rcmholdings.com</text><rect x="56" y="112" width="500" height=".6" fill="#E6E7E9"/><rect x="56" y="111.5" width="34" height="1.6" fill="#FF4A00"/><g id="sample-content"><text x="56" y="160" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400">10 de noviembre de 2026</text><text x="56" y="192" fill="#0B1D3A" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="600">Sra. María López</text><text x="56" y="205" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400">Directora de Compras</text><text x="56" y="218" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400">Northwind Industrial Supply</text><text x="56" y="231" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400">Róterdam, Países Bajos</text><text x="56" y="270" fill="#0B1D3A" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.1">REF.: CONTRATO ANUAL DE SERVICIOS DE CARGA Y ADUANAS</text><text x="56" y="296" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">Estimada Sra. López:</text><text x="56" y="320" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">Le agradecemos la oportunidad de apoyar el creciente programa transatlántico de Northwind.</text><text x="56" y="334.5" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">Adjunto encontrará nuestra propuesta de carga marítima y aérea consolidada, junto con el</text><text x="56" y="349" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">agenciamiento aduanero en origen y destino, gestionado a través de un único punto de contacto.</text><text x="56" y="378" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">Nuestro equipo diseñó el programa en torno a las tres prioridades que usted identificó: tiempos</text><text x="56" y="392.5" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">de tránsito predecibles, visibilidad total de cada envío y un proceso de cumplimiento que elimina</text><text x="56" y="407" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">las sorpresas en frontera. Cada ruta cuenta con especialistas dedicados y nuestra torre de control.</text><text x="56" y="436" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">Quedamos atentos para conversar sobre la propuesta con usted y su equipo.</text><text x="56" y="472.5" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400">Atentamente,</text><text x="56" y="516.5" fill="#0B1D3A" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700">John Anderson</text><text x="56" y="529.5" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="400">Director de Comercio Global</text></g><rect x="56" y="732" width="500" height=".6" fill="#E6E7E9"/><text x="56" y="746" fill="#2B2F36" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="6.6" font-weight="500" letter-spacing="1.1"><tspan font-weight="700" fill="#0B1D3A">RCM HOLDINGS</tspan>   ·   CARGA INTERNACIONAL Y AGENCIAMIENTO ADUANERO</text><text x="530" y="746" fill="#0B1D3A" font-family="'Aktiv Grotesk', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="6.6" font-weight="600" letter-spacing="1.1" text-anchor="end">RCMHOLDINGS.COM</text><polygon points="492,792 612,722 612,792" fill="#0B1D3A"/><line x1="462" y1="792" x2="612" y2="704" stroke="#FF4A00" stroke-width="1.2"/></svg>
