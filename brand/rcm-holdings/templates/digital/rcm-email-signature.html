<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RCM Holdings — Email signature</title>
<!--
  HOW TO USE
  1. Upload logos/png/rcm-logo-horizontal-fullcolor@600w.png to your web server or CDN
     and replace LOGO_URL below with its absolute https:// address
     (email clients cannot display local files or SVG).
  2. Replace the sample name, title and numbers.
  3. Open this file in a browser, select everything inside the dashed box, copy,
     and paste into your mail client's signature settings.
  Only web-safe fonts are used: email clients do not load brand fonts.
-->
<style>
  body { margin: 0; padding: 48px; background: #F7F7F8; font-family: Arial, Helvetica, sans-serif; }
  .frame { display: inline-block; padding: 28px 32px; background: #fff; border: 1px dashed #C9CCD1; }
  .note { margin: 0 0 16px; font: 12px/1.5 Arial, sans-serif; color: #606368; letter-spacing: .04em; }
</style>
</head>
<body>
<p class="note">Copy the signature inside the dashed box.</p>
<div class="frame" id="signature">
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td style="vertical-align:middle;padding:0 22px 0 0;border-right:2px solid #E6E7E9;">
      <a href="https://rcmholdings.com" style="text-decoration:none;">
        <img src="../../logos/png/rcm-logo-horizontal-fullcolor@600w.png" data-replace="LOGO_URL" width="150" alt="RCM Holdings" style="display:block;width:150px;height:auto;border:0;">
      </a>
    </td>
    <td style="vertical-align:middle;padding:0 0 0 22px;">
      <div style="font-size:15px;line-height:20px;font-weight:bold;color:#0B1D3A;">John Anderson</div>
      <div style="font-size:10px;line-height:16px;font-weight:bold;color:#FF4A00;letter-spacing:1.6px;text-transform:uppercase;padding-bottom:8px;">Global Trade Director</div>
      <div style="font-size:12px;line-height:18px;color:#2B2F36;">
        <span style="color:#0B1D3A;font-weight:bold;">T</span>&nbsp;&nbsp;+1 212 555 0100<br>
        <span style="color:#0B1D3A;font-weight:bold;">M</span>&nbsp;&nbsp;+1 917 555 0198<br>
        <span style="color:#0B1D3A;font-weight:bold;">E</span>&nbsp;&nbsp;<a href="mailto:j.anderson@rcmholdings.com" style="color:#2B2F36;text-decoration:none;">j.anderson@rcmholdings.com</a>
      </div>
      <div style="padding-top:8px;font-size:12px;line-height:18px;">
        <a href="https://rcmholdings.com" style="color:#0B1D3A;font-weight:bold;text-decoration:none;">rcmholdings.com</a>
      </div>
    </td>
  </tr>
  <tr>
    <td colspan="2" style="padding-top:16px;">
      <div style="width:36px;height:2px;background:#FF4A00;font-size:0;line-height:0;">&nbsp;</div>
      <div style="padding-top:8px;font-size:9px;line-height:14px;color:#606368;letter-spacing:1.4px;text-transform:uppercase;">Global trade. Intelligently connected.</div>
    </td>
  </tr>
</table>
</div>
</body>
</html>
